name: Publish completion packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable package version, for example 0.1.0-preview.1
        required: true
        type: string
      project:
        description: Publish all four packages or one selected project
        required: true
        type: choice
        default: All
        options:
          - All
          - Diagnostics
          - Completion.Abstractions
          - Completion
          - Completion.Tools
      dependency_versions:
        description: JSON of published direct dependency versions; only for single-package mode
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: completion-nuget-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      ATELIA_RUN_LOCAL_LLM_E2E: '0'
      ATELIA_RUN_CODEX_REASONING_REPLAY_LIVE: '0'
      ATELIA_RUN_CODEX_SUBSCRIPTION_LIVE: '0'
      ATELIA_RUN_CODEX_SUBSCRIPTION_AGENT_CONTROL_LIVE: '0'
      ATELIA_RUN_CODEX_SUBSCRIPTION_SINGLETON_REQUIRED_NAMED_LIVE: '0'
      ATELIA_RUN_CODEX_GPT6_BASIC_LIVE: '0'
      ATELIA_RUN_OPENAI_RESPONSES_GPT6_BASIC_LIVE: '0'
      ATELIA_RUN_ANTHROPIC_OPUS55_BASIC_LIVE: '0'
      ATELIA_RUN_ANTHROPIC_46_TO_55_THINKING_LIVE: '0'
      ATELIA_RUN_GEMINI_31_LITE_TO_38_FLASH_LIVE: '0'
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the matching immutable release tag
        shell: pwsh
        env:
          COMPLETION_VERSION: ${{ inputs.version }}
          COMPLETION_PROJECT: ${{ inputs.project }}
          COMPLETION_DEPENDENCY_VERSIONS: ${{ inputs.dependency_versions }}
        run: |
          $version = $env:COMPLETION_VERSION
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-z0-9]+([.-][a-z0-9]+)*)?$') { throw 'Invalid package version.' }
          if ($env:COMPLETION_PROJECT -eq 'All') {
            if ($env:COMPLETION_DEPENDENCY_VERSIONS.Trim()) { throw 'dependency_versions is only for single-package mode.' }
            $expectedRef = "refs/tags/v$version"
          } else {
            $expectedRef = "refs/tags/Atelia.$($env:COMPLETION_PROJECT)-v$version"
          }
          if ($env:GITHUB_REF -cne $expectedRef) { throw "Dispatch this workflow from $expectedRef, not '$env:GITHUB_REF'." }
          $tagCommit = (& git rev-parse --verify "$expectedRef^{commit}" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve release tag $expectedRef." }
          $headCommit = (& git rev-parse --verify HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $headCommit -cne $tagCommit) { throw 'Checked-out HEAD does not match the selected release tag.' }
          Write-Host "Publishing identity: $expectedRef -> $headCommit"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate release artifacts
        shell: pwsh
        env:
          COMPLETION_VERSION: ${{ inputs.version }}
          COMPLETION_PROJECT: ${{ inputs.project }}
          COMPLETION_DEPENDENCY_VERSIONS: ${{ inputs.dependency_versions }}
        run: |
          dotnet build Atelia.Completion.slnx -c Release -t:Rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Completion.Tests/Completion.Tests.csproj -c Release --no-build --filter 'Category!=LiveE2E&Category!=LocalE2E' --logger trx --results-directory (Join-Path $env:RUNNER_TEMP 'completion-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $feed = Join-Path $env:RUNNER_TEMP 'completion-feed'
          $smoke = Join-Path $env:RUNNER_TEMP 'completion-package-smoke'
          if ($env:COMPLETION_PROJECT -eq 'All') {
            ./eng/Pack.ps1 -Version $env:COMPLETION_VERSION -OutputDirectory $feed
            ./eng/Test-Package.ps1 -Version $env:COMPLETION_VERSION -FeedDirectory $feed -WorkDirectory $smoke
          } else {
            $dependencies = if ($env:COMPLETION_DEPENDENCY_VERSIONS.Trim()) {
              $env:COMPLETION_DEPENDENCY_VERSIONS | ConvertFrom-Json -AsHashtable
            } else { @{} }
            if ($dependencies -isnot [System.Collections.IDictionary]) { throw 'dependency_versions must be a JSON object.' }
            ./eng/Pack.ps1 -Project $env:COMPLETION_PROJECT -Version $env:COMPLETION_VERSION -DependencyVersions $dependencies -OutputDirectory $feed
            ./eng/Test-Package.ps1 -Project $env:COMPLETION_PROJECT -Version $env:COMPLETION_VERSION -FeedDirectory $feed -WorkDirectory $smoke
          }
      # Archive the frozen candidate and manifest before obtaining credentials or pushing.
      - uses: actions/upload-artifact@v4
        with:
          name: completion-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/completion-tests
            ${{ runner.temp }}/completion-feed
            ${{ runner.temp }}/completion-package-smoke/package-smoke-results.json
          if-no-files-found: error
      # NUGET_USER is the individual login (Robird); the trusted policy names package owner Atelia.
      # Configure the policy for this repository, publish.yml and environment nuget before dispatch.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified packages in dependency order
        shell: pwsh
        env:
          COMPLETION_VERSION: ${{ inputs.version }}
          COMPLETION_PROJECT: ${{ inputs.project }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $feed = Join-Path $env:RUNNER_TEMP 'completion-feed'
          $manifestName = if ($env:COMPLETION_PROJECT -eq 'All') {
            "manifest.$env:COMPLETION_VERSION.json"
          } else {
            "manifest.Atelia.$($env:COMPLETION_PROJECT).$($env:COMPLETION_VERSION).json"
          }
          $manifest = Get-Content -LiteralPath (Join-Path $feed $manifestName) -Raw | ConvertFrom-Json
          $headCommit = (& git rev-parse --verify HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $manifest.sourceRevision -cne $headCommit -or
              $manifest.version -cne $env:COMPLETION_VERSION -or
              $manifest.repositoryUrl -cne 'https://github.com/Atelia-org/atelia-completion') { throw 'Manifest identity does not match the selected release.' }
          $expectedIds = if ($env:COMPLETION_PROJECT -eq 'All') {
            @('Atelia.Diagnostics', 'Atelia.Completion.Abstractions', 'Atelia.Completion', 'Atelia.Completion.Tools')
          } else { @("Atelia.$($env:COMPLETION_PROJECT)") }
          $expectedSchema = if ($env:COMPLETION_PROJECT -eq 'All') { 1 } else { 2 }
          if ($manifest.schemaVersion -ne $expectedSchema -or @($manifest.packages).Count -ne $expectedIds.Count) { throw 'Unexpected release manifest shape.' }
          if ($env:COMPLETION_PROJECT -ne 'All') {
            $expectedDependencies = if ($env:COMPLETION_PROJECT -in @('Completion', 'Completion.Tools')) {
              @('Atelia.Diagnostics', 'Atelia.Completion.Abstractions')
            } else { @() }
            $actualDependencies = @($manifest.dependencies | ForEach-Object { $_.id } | Sort-Object)
            if (($actualDependencies -join '|') -cne (($expectedDependencies | Sort-Object) -join '|')) { throw 'Unexpected frozen dependency set.' }
            foreach ($dependency in $manifest.dependencies) {
              if ($dependency.file -cne "$($dependency.id).$($dependency.version).nupkg" -or
                  (Get-FileHash -LiteralPath (Join-Path $feed $dependency.file) -Algorithm SHA256).Hash -ine $dependency.sha256) {
                throw "Frozen dependency changed after validation: $($dependency.id)"
              }
            }
          }
          for ($index = 0; $index -lt $expectedIds.Count; $index++) {
            $package = $manifest.packages[$index]
            if ($package.id -cne $expectedIds[$index]) { throw "Unexpected release package: $($package.id)" }
            if ($package.file -cne "$($package.id).$($env:COMPLETION_VERSION).nupkg" -or
                $package.symbolsFile -cne "$($package.id).$($env:COMPLETION_VERSION).snupkg") { throw "Unexpected release file: $($package.id)" }
            $path = Join-Path $feed $package.file
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $package.sha256) { throw "Package changed after validation: $($package.id)" }
            $symbols = Join-Path $feed $package.symbolsFile
            if ((Get-FileHash -LiteralPath $symbols -Algorithm SHA256).Hash -ine $package.symbolsSha256) { throw "Symbols changed after validation: $($package.id)" }
            dotnet nuget push $path --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify public packages and consumers
        shell: pwsh
        env:
          COMPLETION_VERSION: ${{ inputs.version }}
          COMPLETION_PROJECT: ${{ inputs.project }}
        run: |
          ./eng/Verify-Published.ps1 -Project $env:COMPLETION_PROJECT -Version $env:COMPLETION_VERSION -FeedDirectory (Join-Path $env:RUNNER_TEMP 'completion-feed') -WorkDirectory (Join-Path $env:RUNNER_TEMP 'completion-public-smoke')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-public-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/completion-public-smoke/published-check.json
          if-no-files-found: ignore
