name: Completion CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      ATELIA_RUN_LOCAL_LLM_E2E: '0'
      ATELIA_RUN_CODEX_REASONING_REPLAY_LIVE: '0'
      ATELIA_RUN_CODEX_SUBSCRIPTION_LIVE: '0'
      ATELIA_RUN_CODEX_SUBSCRIPTION_AGENT_CONTROL_LIVE: '0'
      ATELIA_RUN_CODEX_SUBSCRIPTION_SINGLETON_REQUIRED_NAMED_LIVE: '0'
      ATELIA_RUN_CODEX_GPT6_BASIC_LIVE: '0'
      ATELIA_RUN_OPENAI_RESPONSES_GPT6_BASIC_LIVE: '0'
      ATELIA_RUN_ANTHROPIC_OPUS55_BASIC_LIVE: '0'
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test offline
        shell: pwsh
        run: |
          dotnet build Atelia.Completion.slnx -c Release -t:Rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Completion.Tests/Completion.Tests.csproj -c Release --no-build --filter 'Category!=LiveE2E&Category!=LocalE2E' --logger trx --results-directory (Join-Path $env:RUNNER_TEMP 'completion-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack and verify a real package consumer
        shell: pwsh
        run: |
          $platform = $env:RUNNER_OS.ToLowerInvariant()
          $version = "0.1.0-ci.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT.$platform"
          $feed = Join-Path $env:RUNNER_TEMP 'completion-feed'
          ./eng/Pack.ps1 -Version $version -OutputDirectory $feed
          ./eng/Test-Package.ps1 -Version $version -FeedDirectory $feed -WorkDirectory (Join-Path $env:RUNNER_TEMP 'completion-package-smoke')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/completion-tests
            ${{ runner.temp }}/completion-feed
            ${{ runner.temp }}/completion-package-smoke/package-smoke-results.json
          if-no-files-found: ignore
